[package]
name = "wenshu-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wenshu document core: the WordCraft engine with Chinese defaults (fonts, region)"

[lints]
workspace = true

[dependencies]
wenshu-cjk = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-doc = { workspace = true }
wordcraft-fonts = { workspace = true }
serde_json = { workspace = true }
# OFD export (`ofd`): the page display list written through wenshu-ofd.
wenshu-ofd = { workspace = true }
wordcraft-layout = { workspace = true }
wordcraft-geom = { workspace = true }
wordcraft-metafile = { workspace = true }
kurbo = { workspace = true }
log = { workspace = true }
image = { workspace = true, features = ["jpeg", "gif", "bmp", "tiff", "webp"] }

[dev-dependencies]
zip = { workspace = true }
