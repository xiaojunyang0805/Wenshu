[package]
name = "wenshu-ofd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "OFD (GB/T 33190-2016) writer: pages of text, paths and images, with embedded font subsets"

[lints]
workspace = true

[dependencies]
zip = { workspace = true }
