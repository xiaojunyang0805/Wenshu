# Release packages for Wenshu (文枢).
#
#   push a tag vX.Y.Z[-pre]  build every package and attach them to a DRAFT GitHub release;
#                            a maintainer reviews the draft and publishes it by hand
#   Actions › Release › Run  build every package as workflow artifacts only (a test run)
#
# Packages: Windows x64 portable zip + per-user MSI (packaging/windows/package.ps1), Linux x86_64
# tar.gz + .deb + AppImage (packaging/linux/package.sh, built on Ubuntu 22.04 for glibc 2.35),
# Linux loongarch64 tar.gz + .deb (cross-built, glibc 2.36; the CLI is smoke-tested under qemu),
# and the VS Code preview extension (.vsix, vscode/package.py; its version must match Cargo.toml).
# The binaries are not code-signed yet: Windows SmartScreen warns on first start.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the version; a tag must match it
        run: |
          version=$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Fetch and patch WordCraft
        shell: bash
        run: sh scripts/sync-upstream.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> eval/target/wordcraft"
          key: windows-x64
      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build and package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/package.ps1
      - name: Smoke test
        shell: bash
        run: |
          mkdir smoke && cd smoke
          unzip -q ../dist/wenshu-*-windows-x64-portable.zip
          ./wenshu.exe > /dev/null && echo "ok wenshu.exe runs"
          test -f ../dist/wenshu-${{ needs.version.outputs.version }}-windows-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev \
            libfontconfig1-dev libfreetype-dev desktop-file-utils appstream
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Fetch and patch WordCraft
        run: sh scripts/sync-upstream.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> eval/target/wordcraft"
          key: linux-x86_64
      - name: Build and package
        run: bash packaging/linux/package.sh
      - name: Smoke test
        run: |
          sudo apt-get install -y -qq ./dist/wenshu-*-linux-x86_64.deb
          wenshu > /dev/null && echo "ok wenshu runs"
          dpkg -s wenshu | grep -q libxkbcommon-x11-0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  vscode:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Package the VS Code extension
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ext=$(python3 -c "import json; print(json.load(open('vscode/package.json', encoding='utf-8'))['version'])")
          if [[ "$ext" != "$VERSION" ]]; then
            echo "::error::vscode/package.json version $ext does not match Cargo.toml version $VERSION"
            exit 1
          fi
          node --check vscode/extension.js
          python3 vscode/package.py
          unzip -l dist/wenshu-preview-$VERSION.vsix | grep -q extension/extension.js
      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: dist/*.vsix
          if-no-files-found: error

  # The self-hostable browser app (scripts/build-web.sh): a static site in a zip, the app (wasm,
  # size profile `web`), Wenshu's fonts as WOFF2 and the licences, with HOSTING.md as README.md.
  web:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust, wasm target and trunk
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
          cargo install trunk --locked --version 0.22.1
      - name: fontTools for WOFF2
        run: python3 -m pip install --quiet fonttools==4.61.0 brotli==1.2.0
      - name: Fetch and patch WordCraft
        run: sh scripts/sync-upstream.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> eval/target/wordcraft"
          key: web
      - name: Build
        run: CARGO_BUILD_JOBS=2 bash scripts/build-web.sh
      - name: Check and zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist/web
          test -f index.html && test -f README.md && ls *.wasm
          n=$(python3 -c "import json; print(len(json.load(open('fonts/fonts.json'))['files']))")
          test "$n" -eq 24 && echo "ok $n fonts"
          zip -q -r "../wenshu-$VERSION-web.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*-web.zip
          if-no-files-found: error

  # Cross-built on x86_64 with cargo-zigbuild against glibc 2.36 (new-world LoongArch ABI), then the
  # CLI runs under qemu-user on a Debian loong64 glibc: it writes, checks and renders a 公文.
  linux-loongarch64:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Rust, Zig and cargo-zigbuild
        run: |
          # Pinned: Rust 1.100 passes --no-rosegment to the linker for LoongArch, which Zig 0.14's
          # linker refuses (2026-11-13); 1.99.1 built v0.1.4.
          rustup toolchain install 1.99.1 --profile minimal --target loongarch64-unknown-linux-gnu
          rustup default 1.99.1
          pip3 install --user "ziglang==0.14.1"
          cargo install --locked cargo-zigbuild --version 0.20.1
      - name: Fetch and patch WordCraft
        run: sh scripts/sync-upstream.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> eval/target/wordcraft"
          key: linux-loongarch64
      - name: qemu-user and a loong64 glibc (Debian, by snapshot hash)
        run: |
          fetch() { curl -fsSL -o "$3" "https://snapshot.debian.org/file/$1"; echo "$2  $3" | sha256sum -c -; }
          mkdir -p ~/la64/sysroot/lib64 ~/la64/qemu && cd ~/la64
          fetch dec1373851d29f91642c197f4a339d0d2ad25ed0 ca6ede739327a20ae5a3498230c8a3a9a072c586e131bc6bcc1201eb1725e336 qemu-user.deb
          fetch 4da25b0a573cad72b6aa2bd873c18ef7296a06ad b6346725a3b73f4dde5c9ba15d7399b15b45076e923d8a91dedfafc22c649efb libc6.deb
          fetch fd21dc50c6b06c7846827d1a07cce2594eaf4270 737ba3eaed19149116c1af0119369c121e01821faaf0aa78696a91b6dc491589 libgcc-s1.deb
          dpkg-deb -x qemu-user.deb qemu
          dpkg-deb -x libc6.deb sysroot && dpkg-deb -x libgcc-s1.deb sysroot
          ln -s ../usr/lib/loongarch64-linux-gnu/ld-linux-loongarch-lp64d.so.1 sysroot/lib64/
          echo "CROSS_RUNNER=$HOME/la64/qemu/usr/bin/qemu-loongarch64 -L $HOME/la64/sysroot" >> "$GITHUB_ENV"
      - name: Build and package
        run: bash packaging/linux/package.sh --arch loongarch64
      - name: Smoke test (qemu)
        run: |
          mkdir smoke && tar -xzf dist/wenshu-*-linux-loongarch64.tar.gz -C smoke --strip-components=1
          export WENSHU_FONTS_DIR=$PWD/smoke/share/wenshu/fonts
          $CROSS_RUNNER smoke/bin/wenshu gongwen new examples/gongwen-sample.json smoke/t.docx
          $CROSS_RUNNER smoke/bin/wenshu gongwen check smoke/t.docx
          $CROSS_RUNNER smoke/bin/wenshu render smoke/t.docx smoke/p1.png
          dpkg-deb -f dist/wenshu-*-linux-loongarch64.deb Architecture Depends
      - uses: actions/upload-artifact@v4
        with:
          name: linux-loongarch64
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, linux, linux-loongarch64, vscode, web]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          文枢 Wenshu $VERSION

          | Download | For |
          |---|---|
          | \`wenshu-$VERSION-windows-x64.msi\` | Windows 10/11, installs for the current user (no admin) |
          | \`wenshu-$VERSION-windows-x64-portable.zip\` | Windows, no install |
          | \`wenshu-$VERSION-linux-x86_64.deb\` | Debian, Ubuntu, Deepin, UOS, Kylin |
          | \`wenshu-$VERSION-linux-x86_64.AppImage\` | other Linux distributions (glibc ≥ 2.35) |
          | \`wenshu-$VERSION-linux-x86_64.tar.gz\` | a plain file tree |
          | \`wenshu-$VERSION-linux-loongarch64.deb\` | LoongArch, new-world (deepin 23+, openKylin 2, Loongnix 25, Debian loong64; glibc ≥ 2.36) |
          | \`wenshu-$VERSION-linux-loongarch64.tar.gz\` | LoongArch, a plain file tree |
          | \`wenshu-$VERSION-web.zip\` | the browser version: a static site for any web server, an intranet one too; documents stay in the browser (see its README.md) |
          | \`wenshu-preview-$VERSION.vsix\` | VS Code: preview documents as Wenshu lays them out (needs Wenshu installed; \`code --install-extension <file>\`) |

          The binaries are not code-signed yet, so Windows SmartScreen asks before the first start
          ("More info" › "Run anyway"). Check downloads against \`SHA256SUMS\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "文枢 Wenshu $VERSION" --notes-file notes.md
