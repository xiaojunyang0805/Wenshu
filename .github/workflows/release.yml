# Release packages for Wenshu (文枢).
#
#   push a tag vX.Y.Z[-pre]  build every package and attach them to a DRAFT GitHub release;
#                            a maintainer reviews the draft and publishes it by hand
#   Actions › Release › Run  build every package as workflow artifacts only (a test run)
#
# Packages: Windows x64 portable zip + per-user MSI (packaging/windows/package.ps1), Linux x86_64
# tar.gz + .deb + AppImage (packaging/linux/package.sh, built on Ubuntu 22.04 for glibc 2.35).
# The binaries are not code-signed yet: Windows SmartScreen warns on first start.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read the version; a tag must match it
        run: |
          version=$(awk '/^\[/ { p = ($0 == "[workspace.package]"); next } p && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Fetch and patch WordCraft
        shell: bash
        run: sh scripts/sync-upstream.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> eval/target/wordcraft"
          key: windows-x64
      - name: WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build and package
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/windows/package.ps1
      - name: Smoke test
        shell: bash
        run: |
          mkdir smoke && cd smoke
          unzip -q ../dist/wenshu-*-windows-x64-portable.zip
          ./wenshu.exe > /dev/null && echo "ok wenshu.exe runs"
          test -f ../dist/wenshu-${{ needs.version.outputs.version }}-windows-x64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libxkbcommon-dev \
            libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev \
            libfontconfig1-dev libfreetype-dev desktop-file-utils appstream
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Fetch and patch WordCraft
        run: sh scripts/sync-upstream.sh
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> eval/target/wordcraft"
          key: linux-x86_64
      - name: Build and package
        run: bash packaging/linux/package.sh
      - name: Smoke test
        run: |
          sudo apt-get install -y -qq ./dist/wenshu-*-linux-x86_64.deb
          wenshu > /dev/null && echo "ok wenshu runs"
          dpkg -s wenshu | grep -q libxkbcommon-x11-0
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          文枢 Wenshu $VERSION

          | Download | For |
          |---|---|
          | \`wenshu-$VERSION-windows-x64.msi\` | Windows 10/11, installs for the current user (no admin) |
          | \`wenshu-$VERSION-windows-x64-portable.zip\` | Windows, no install |
          | \`wenshu-$VERSION-linux-x86_64.deb\` | Debian, Ubuntu, Deepin, UOS, Kylin |
          | \`wenshu-$VERSION-linux-x86_64.AppImage\` | other Linux distributions (glibc ≥ 2.35) |
          | \`wenshu-$VERSION-linux-x86_64.tar.gz\` | a plain file tree |

          The binaries are not code-signed yet, so Windows SmartScreen asks before the first start
          ("More info" › "Run anyway"). Check downloads against \`SHA256SUMS\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "文枢 Wenshu $VERSION" --notes-file notes.md
