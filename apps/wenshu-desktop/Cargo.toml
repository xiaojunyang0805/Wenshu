[package]
name = "wenshu-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wenshu desktop: the WordCraft desktop front end as 文枢, with Chinese defaults and 公文 templates"
publish = false

[lints]
workspace = true

[[bin]]
name = "wenshu-desktop"
path = "src/main.rs"

[dependencies]
wenshu-core = { workspace = true }
wenshu-gongwen = { workspace = true }
wordcraft = { workspace = true }
wordcraft-control-key = { workspace = true }
log = { workspace = true }

[build-dependencies]
# Icon and version info for wenshu-desktop.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"
